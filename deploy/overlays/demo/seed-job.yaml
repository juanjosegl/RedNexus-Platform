# Datos sintéticos de la demo (50 perfiles ficticios, sin datos personales reales; Ley 1581).
# Hook PostSync de Argo CD: corre después de cada sincronización, cuando la API ya aplicó las
# migraciones. El seed usa upsert, así que repetirlo no duplica nada.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-demo
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: rednexus-api
          command: ['sh', '-c', 'prisma migrate deploy && prisma db seed']
          envFrom:
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
