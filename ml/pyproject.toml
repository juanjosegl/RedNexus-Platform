[project]
name = "rednexus-ml"
version = "0.1.0"
description = "Experimentos de emparejamiento de RedNexus con MLflow (IA-06, IA-07)"
requires-python = ">=3.11,<3.14"
# mlflow-skinny: seguimiento de experimentos y registro de modelos sin la interfaz web (liviano).
dependencies = [
    "mlflow-skinny>=2.17,<4",
    "numpy>=1.26",
    "requests>=2.32",
    # backend SQLite de MLflow (experimentos y Model Registry en mlflow.db)
    "sqlalchemy>=2",
    "alembic>=1.13",
]

[dependency-groups]
# interfaz web de MLflow: uv sync --group ui && uv run mlflow ui --backend-store-uri sqlite:///mlflow.db
ui = ["mlflow>=2.17,<4"]

[tool.uv]
package = false
default-groups = []
