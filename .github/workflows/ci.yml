name: CI

on:
  pull_request:
    branches: [developer, test, main]
  push:
    branches: [developer, test, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cada overlay, las políticas y la observabilidad deben renderizar y cumplir el esquema de
      # Kubernetes y de los CRD (SealedSecret, políticas de Kyverno) del catálogo de datree
      - name: Kustomize + kubeconform
        run: |
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in deploy/overlays/*/ deploy/policies/ deploy/observabilidad/; do
            echo "::group::$dir"
            kubectl kustomize "$dir" \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                  -schema-location default -schema-location "$catalog" -
            echo "::endgroup::"
          done

      # PL-06: formato y validación de OpenTofu (sin conectarse al clúster ni a GitHub)
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.x
          tofu_wrapper: false
      - name: OpenTofu
        run: |
          tofu fmt -check -recursive iac
          for root in iac/cluster iac/github; do
            tofu -chdir="$root" init -backend=false -input=false >/dev/null
            tofu -chdir="$root" validate
          done

      - name: Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f observabilidad/compose.yaml config --quiet
          python3 -m json.tool deploy/observabilidad/dashboards/rednexus-slo.json >/dev/null

      - name: Scripts
        run: shellcheck scripts/*.sh

      # Asistente RAG: formato del golden dataset, sintaxis de los scripts y compose de Open WebUI
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asistente RAG
        run: |
          python asistente-rag/scripts/validate_dataset.py
          python -m py_compile asistente-rag/evaluate_rag.py asistente-rag/scripts/*.py
          docker compose -f asistente-rag/docker-compose.yml config --quiet
      - name: ML (dataset sintético y experimentos)
        run: |
          # el dataset en JSON debe ser exactamente el que genera el script
          python ml/data/build_dataset.py
          git diff --exit-code ml/data
          python -m py_compile ml/rednexus_ml.py ml/run_experiments.py ml/scripts/*.py
