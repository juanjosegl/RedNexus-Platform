# PL-07: observabilidad local en un solo contenedor (Grafana, Tempo, Prometheus y collector OTLP).
#
#   docker compose -f observabilidad/compose.yaml up -d      -> Grafana en http://localhost:3002
#
# Luego, en el .env del backend: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# (o, con el compose.yaml de este repo: OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318)
# El tablero "RedNexus · SLO y operación" queda como página de inicio.
name: rednexus-observabilidad

services:
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - '3002:3000' # Grafana (el 3000 es de la API y el 3001 de Open WebUI)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/rednexus-dashboards/rednexus-slo.json
    volumes:
      - ../deploy/observabilidad/dashboards:/var/lib/rednexus-dashboards:ro
      - ../deploy/observabilidad/rednexus-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/rednexus-dashboards.yaml:ro
      - lgtm-data:/data
    mem_limit: 1g

volumes:
  lgtm-data:
