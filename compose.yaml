# Stack completo de RedNexus con Docker Compose, construido desde los repos hermanos:
#   University/
#   ├── RedNexus-Backend/
#   ├── RedNexus-Frontend/
#   └── RedNexus-Platform/   <- este repo
#
# Uso:     docker compose up -d --build     ->  http://localhost:8088
# Apagar:  docker compose down              (agrega -v para borrar la base de datos)
#
# Para programar dia a dia no hace falta: basta con el docker-compose.yml del backend
# (solo Postgres y Redis) y correr la API y el frontend con npm. Este archivo sirve para
# probar las imagenes tal como iran a Kubernetes, y tambien las construye para k3d
# (scripts/k8s-up.sh).
name: rednexus

x-api-env: &api-env
  NODE_ENV: production
  PORT: '3000'
  DATABASE_URL: postgresql://rednexus:rednexus@postgres:5432/rednexus
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # Ollama corre fuera de Docker (en Mac, nativo para usar la GPU con Metal)
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_LLM_MODEL: llama3.2:3b
  OLLAMA_EMBED_MODEL: nomic-embed-text
  JWT_SECRET: solo-para-desarrollo-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rednexus
      POSTGRES_PASSWORD: rednexus
      POSTGRES_DB: rednexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rednexus']
      interval: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    mem_limit: 128m

  migrate:
    image: rednexus-api-migrate:dev
    build:
      context: ../RedNexus-Backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://rednexus:rednexus@postgres:5432/rednexus
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: rednexus-api:dev
    build: ../RedNexus-Backend
    environment: *api-env
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    mem_limit: 384m

  worker:
    image: rednexus-api:dev
    command: ['node', 'dist/worker']
    environment: *api-env
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    mem_limit: 384m

  web:
    image: rednexus-web:dev
    build: ../RedNexus-Frontend
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '8088:8080'
    depends_on:
      api:
        condition: service_started
        # Nginx resuelve "api" al arrancar; si api se recrea cambia de IP y hay que reiniciar web
        restart: true
    mem_limit: 64m

volumes:
  pgdata:
