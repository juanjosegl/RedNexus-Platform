# PL-03: clúster de la demo GitOps (Argo CD + Kyverno + Sealed Secrets). Lo crea
# scripts/gitops-up.sh. Es otro clúster que el de desarrollo (k3d/cluster.yaml) para no
# mezclar las imágenes :dev con la política de imágenes firmadas; enciende uno a la vez.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: rednexus-demo
servers: 1
agents: 0
ports:
  # La app (Traefik) en http://localhost:8090
  - port: 8090:80
    nodeFilters:
      - loadbalancer
