# PL-08: catálogo de servicios (formato de Backstage). Cada repo describe sus componentes en
# su propio catalog-info.yaml; este declara el sistema, el equipo y la infraestructura.
# Para registrarlo en un Backstage: Create → Register existing component → URL de este archivo.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: rednexus
  title: RedNexus
  description: Red de apoyo académico con emparejamiento por IA local (Diplomado CloudForge AI 5.0, Unicomfacauca)
  links:
    - url: https://github.com/users/juanjosegl/projects/1
      title: Tablero del equipo
spec:
  owner: group:rednexus-equipo
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: rednexus-equipo
  title: Equipo RedNexus
spec:
  type: team
  children: []
  members: [juanjosegl, daniel200231, josesfa, maripau-dev, alejandraguzman12]
---
apiVersion: backstage.io/v1alpha1
kind: User
