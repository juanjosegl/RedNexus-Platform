# Recibe OTLP en 4317 (gRPC) y 4318 (HTTP); Grafana en 3000.
# La API y el worker envían a http://lgtm.observabilidad:4318 (overlay demo).
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate # un solo volumen de datos
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.41.1
          env:
            # demo local: Grafana sin contraseña y solo lectura para anónimos
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/rednexus-dashboards/rednexus-slo.json
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/rednexus-dashboards
            - name: dashboards-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/rednexus-dashboards.yaml
              subPath: rednexus-dashboards.yaml
            - name: data
              mountPath: /data
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: data
          emptyDir:
            sizeLimit: 2Gi
